# Default language for console and unknown player locale: ru, en
default-locale: en

# Karma range
karma:
  min: -1000
  max: 1000

# Karma change per action
karma-actions:
  kill-hostile: 1
  kill-boss: 50
  villager-trade: 2
  cure-zombie-villager: 30
  feed-animal: 1
  kill-passive: -3
  kill-tamed: -20
  kill-villager: -25
  kill-player: -15
  kill-good-player: -30
  kill-evil-player: 10

# Karma decay
decay:
  enabled: true
  percent-per-hour: 1.0
  min-threshold: 100

# Anti-farm protection
anti-farm:
  pvp-cooldown-minutes: 30
  mutual-kill-window-minutes: 5
  spawner-karma-multiplier: 0.5
  spawner-counts-for-titles: false

# Karmic titles (auto-grant/revoke based on current karma)
karma-titles:
  tyrant:
    range: [-1000, -800]
    color: "dark_red"
    name: { en: "Tyrant", ru: "Тиран" }
  punisher:
    range: [-800, -600]
    color: "red"
    name: { en: "Punisher", ru: "Каратель" }
  thug:
    range: [-600, -400]
    color: "red"
    name: { en: "Thug", ru: "Головорез" }
  bandit:
    range: [-400, -200]
    color: "gold"
    name: { en: "Bandit", ru: "Разбойник" }
  defender:
    range: [200, 400]
    color: "green"
    name: { en: "Defender", ru: "Защитник" }
  guardian:
    range: [400, 600]
    color: "green"
    name: { en: "Guardian", ru: "Страж" }
  hero:
    range: [600, 800]
    color: "aqua"
    name: { en: "Hero", ru: "Герой" }
  legend:
    range: [800, 1000]
    color: "light_purple"
    name: { en: "Legend", ru: "Легенда" }

# Buff system
buffs:
  # Potion effect duration in ticks (should be slightly longer than check-interval)
  effect-duration: 1400

  # Negative karma buffs
  negative:
    -200:
      effects:
        - { type: STRENGTH, amplifier: 0 }
    -400:
      effects:
        - { type: STRENGTH, amplifier: 0 }
    -600:
      effects:
        - { type: STRENGTH, amplifier: 1 }
      block-trading: true
    -800:
      effects:
        - { type: STRENGTH, amplifier: 1 }
        - { type: SPEED, amplifier: 0 }
      block-trading: true
      golem-aggro: true
      golem-aggro-range: 16.0

  # Positive karma buffs
  positive:
    200:
      effects:
        - { type: REGENERATION, amplifier: 0, ambient: true }
    400:
      effects:
        - { type: REGENERATION, amplifier: 0 }
      xp-bonus: 0.10
      pvp-damage-penalty: 0.05
    600:
      effects:
        - { type: REGENERATION, amplifier: 0 }
        - { type: HERO_OF_THE_VILLAGE, amplifier: 0 }
      pvp-damage-penalty: 0.10
    800:
      effects:
        - { type: REGENERATION, amplifier: 1 }
        - { type: HERO_OF_THE_VILLAGE, amplifier: 1 }
        - { type: LUCK, amplifier: 0 }
      pvp-damage-penalty: 0.15
      no-first-strike: true
      first-strike-cooldown-seconds: 5

# Tab display
tab:
  enabled: true

# Task intervals (ticks)
buff-check-interval: 300
