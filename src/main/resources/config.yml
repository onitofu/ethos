# Default language for console and unknown player locale: ru, en
default-locale: en

# Title automatically given to new players (-1 to disable)
default-title: 0

# Karma reset cooldown (days). Players can use /karma reset once per this period.
karma-reset-cooldown-days: 30

# Karma range
karma:
  min: -10000
  max: 10000

# Karma change per action
karma-actions:
  kill-hostile: 3
  kill-boss: 250
  villager-trade: 10
  cure-zombie-villager: 30
  feed-animal: 10
  kill-passive: -5
  kill-tamed: -25
  kill-villager: -25
  kill-golem: -15
  kill-player: -25
  kill-good-player: -50
  kill-evil-player: 50

# Karma decay — fixed points per day towards zero
decay:
  enabled: true
  points-per-day: 5

# Anti-farm protection
anti-farm:
  pvp-cooldown-minutes: 10
  mutual-kill-window-minutes: 5
  spawner-karma-multiplier: 0
  spawner-counts-for-titles: false
  trade-cooldown-seconds: 300
  feed-cooldown-seconds: 300
  # AFK detection: no karma from mob kills if player hasn't moved
  afk-threshold-seconds: 5
  afk-move-distance: 5.0
  # Mob streak: after N kills of same mob type, karma stops until different type killed
  mob-streak-limit: 10

# Karmic titles — map title ID to karma range (names/colors are in titles.yml)
karma-titles:
  1: [-2000, -1000]
  2: [-3000, -2000]
  3: [-4000, -3000]
  4: [-5000, -4000]
  5: [-6000, -5000]
  6: [-7000, -6000]
  7: [-8000, -7000]
  8: [-9000, -8000]
  9: [-10000, -9000]
  230: [-10001, -10000]
  10: [1000, 2000]
  11: [2000, 3000]
  12: [3000, 4000]
  13: [4000, 5000]
  14: [5000, 6000]
  15: [6000, 7000]
  16: [7000, 8000]
  17: [8000, 9000]
  18: [9000, 10000]
  231: [10000, 10001]

