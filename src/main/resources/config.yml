# Default language for console and unknown player locale: ru, en
default-locale: en

# Title automatically given to new players (-1 to disable)
default-title: 0

# Karma range
karma:
  min: -10000
  max: 10000

# Karma change per action
karma-actions:
  kill-hostile: 1
  kill-boss: 50
  villager-trade: 2
  cure-zombie-villager: 30
  feed-animal: 1
  kill-passive: -3
  kill-tamed: -20
  kill-villager: -25
  kill-golem: -15
  kill-player: -15
  kill-good-player: -30
  kill-evil-player: 10

# Karma decay
decay:
  enabled: true
  percent-per-hour: 1.0
  min-threshold: 100

# Anti-farm protection
anti-farm:
  pvp-cooldown-minutes: 30
  mutual-kill-window-minutes: 5
  spawner-karma-multiplier: 0.5
  spawner-counts-for-titles: false
  trade-cooldown-seconds: 60
  # AFK detection: no karma from mob kills if player hasn't moved
  afk-threshold-seconds: 30
  afk-move-distance: 5.0

# Karmic titles — map title ID to karma range (names/colors are in titles.yml)
karma-titles:
  1: [-10000, -9000]
  2: [-9000, -8000]
  3: [-8000, -7000]
  4: [-7000, -6000]
  5: [-6000, -5000]
  6: [-5000, -4000]
  7: [-4000, -3000]
  8: [-3000, -2000]
  9: [-2000, -1000]
  10: [1000, 2000]
  11: [2000, 3000]
  12: [3000, 4000]
  13: [4000, 5000]
  14: [5000, 6000]
  15: [6000, 7000]
  16: [7000, 8000]
  17: [8000, 9000]
  18: [9000, 10001]

# Buff system
buffs:
  # Potion effect duration in ticks (should be slightly longer than check-interval)
  effect-duration: 1400

  # Negative karma — better at combat, worse at economy
  negative:
    -1000:
      mob-damage-bonus: 0.03
      trade-price-increase: 1
    -2000:
      mob-damage-bonus: 0.05
      trade-price-increase: 1
    -3000:
      mob-damage-bonus: 0.07
      speed-bonus: 0.03
      trade-price-increase: 2
    -4000:
      mob-damage-bonus: 0.10
      speed-bonus: 0.05
      trade-price-increase: 2
    -5000:
      mob-damage-bonus: 0.12
      speed-bonus: 0.07
      block-trading: true
    -6000:
      mob-damage-bonus: 0.15
      speed-bonus: 0.10
      block-trading: true
    -7000:
      mob-damage-bonus: 0.17
      speed-bonus: 0.12
      block-trading: true
      golem-aggro: true
      golem-aggro-range: 16.0
    -8000:
      mob-damage-bonus: 0.20
      speed-bonus: 0.15
      block-trading: true
      golem-aggro: true
      golem-aggro-range: 20.0
    -9000:
      mob-damage-bonus: 0.22
      speed-bonus: 0.17
      block-trading: true
      golem-aggro: true
      golem-aggro-range: 24.0
    -10000:
      mob-damage-bonus: 0.25
      speed-bonus: 0.20
      block-trading: true
      golem-aggro: true
      golem-aggro-range: 32.0

  # Positive karma — better at economy, slightly weaker in PvP
  positive:
    1000:
      xp-bonus: 0.03
    2000:
      xp-bonus: 0.05
    3000:
      xp-bonus: 0.07
    4000:
      xp-bonus: 0.10
    5000:
      xp-bonus: 0.12
      effects:
        - { type: HERO_OF_THE_VILLAGE, amplifier: 0 }
      pvp-damage-penalty: 0.03
    6000:
      xp-bonus: 0.15
      effects:
        - { type: HERO_OF_THE_VILLAGE, amplifier: 0 }
      pvp-damage-penalty: 0.05
    7000:
      xp-bonus: 0.17
      effects:
        - { type: HERO_OF_THE_VILLAGE, amplifier: 1 }
      pvp-damage-penalty: 0.07
    8000:
      xp-bonus: 0.20
      effects:
        - { type: HERO_OF_THE_VILLAGE, amplifier: 1 }
        - { type: LUCK, amplifier: 0 }
      pvp-damage-penalty: 0.10
    9000:
      xp-bonus: 0.22
      effects:
        - { type: HERO_OF_THE_VILLAGE, amplifier: 1 }
        - { type: LUCK, amplifier: 0 }
      pvp-damage-penalty: 0.12
    10000:
      xp-bonus: 0.25
      effects:
        - { type: HERO_OF_THE_VILLAGE, amplifier: 2 }
        - { type: LUCK, amplifier: 0 }
      pvp-damage-penalty: 0.15

# Tab display
tab:
  enabled: false

# Task intervals (ticks)
buff-check-interval: 1200
unlock-check-interval: 6000
