# Passive mob hostile damage (when PASSIVE_MOB_HOSTILE is active)
passive-mob-damage:
  large: 5.0
  medium: 3.0
  small: 1.0
  default: 1.0

# Tab display
tab:
  enabled: false

# Task intervals (ticks)
buff-check-interval: 1200
unlock-check-interval: 6000
