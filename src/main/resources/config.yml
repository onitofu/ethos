# Default language for console and unknown player locale: ru, en
default-locale: en

# Title automatically given to new players (-1 to disable)
default-title: 0

# Karma range
karma:
  min: -10000
  max: 10000

# Karma change per action
karma-actions:
  kill-hostile: 1
  kill-boss: 50
  villager-trade: 2
  cure-zombie-villager: 30
  feed-animal: 1
  kill-passive: -3
  kill-tamed: -20
  kill-villager: -25
  kill-golem: -15
  kill-player: -15
  kill-good-player: -30
  kill-evil-player: 10

# Karma decay
decay:
  enabled: true
  percent-per-hour: 1.0
  min-threshold: 100

# Anti-farm protection
anti-farm:
  pvp-cooldown-minutes: 30
  mutual-kill-window-minutes: 5
  spawner-karma-multiplier: 0.5
  spawner-counts-for-titles: false
  trade-cooldown-seconds: 60
  # AFK detection: no karma from mob kills if player hasn't moved
  afk-threshold-seconds: 30
  afk-move-distance: 5.0

# Karmic titles — map title ID to karma range (names/colors are in titles.yml)
karma-titles:
  1: [-10000, -9000]
  2: [-9000, -8000]
  3: [-8000, -7000]
  4: [-7000, -6000]
  5: [-6000, -5000]
  6: [-5000, -4000]
  7: [-4000, -3000]
  8: [-3000, -2000]
  9: [-2000, -1000]
  10: [1000, 2000]
  11: [2000, 3000]
  12: [3000, 4000]
  13: [4000, 5000]
  14: [5000, 6000]
  15: [6000, 7000]
  16: [7000, 8000]
  17: [8000, 9000]
  18: [9000, 10001]

# Buff system — unified modifier format
buffs:
  effect-duration: 1400
  tiers:
    # === Negative karma ===
    -1000:
      effects:
        - { type: MOB_DAMAGE_BONUS, value: 0.03 }
        - { type: TRADE_PRICE_INCREASE, value: 1 }
